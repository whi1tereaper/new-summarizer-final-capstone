name: Deploy to HestiaCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'article_rizer' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.SERVER_USER || 'article_rizer' }}/web/${{ secrets.SERVER_DOMAIN || 'depended.poc-online.net' }}/public_html"
            echo "Deploying DEPENDED to ${APP_DIR}..."
            
            if [ ! -d "${APP_DIR}" ]; then
              echo "Target directory ${APP_DIR} does not exist!"
              exit 1
            fi
            
            cd "${APP_DIR}"
            
            # Fetch and apply latest code from main
            git fetch origin main
            git reset --hard origin/main
            
            # Run the automated deployment and verification pipeline
            chmod +x scripts/deploy_hestia.sh
            bash scripts/deploy_hestia.sh

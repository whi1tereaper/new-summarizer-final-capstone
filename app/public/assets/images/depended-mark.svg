<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <style>
    :root { color-scheme: light dark; }
    .depended-primary { fill: #16171c; }
    .depended-accent  { fill: #7f00ff; }
    @media (prefers-color-scheme: dark) {
      .depended-primary { fill: #f2f1f6; }
      .depended-accent  { fill: #b59aff; }
    }
  </style>
  <!-- Outer D letterform with dual precision counters for DEPENDED -->
  <path class="depended-primary" fill-rule="evenodd" clip-rule="evenodd" d="M4 4h12c6.627 0 12 5.373 12 12s-5.373 12-12 12H4V4zm6 5h5.5c3.038 0 5.5 2.015 5.5 4.5H10V9zm0 9.5h11c0 2.485-2.462 4.5-5.5 4.5H10v-4.5z"/>
  <!-- Central tier accent (Extraction & Decoding Bridge) -->
  <rect class="depended-accent" x="10" y="14" width="11" height="4" rx="1"/>
</svg>


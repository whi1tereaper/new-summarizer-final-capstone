  <text class="dee-muted" x="53" y="39" font-family="'Satoshi', 'Outfit', 'Inter', system-ui, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.14em">SUMMARIZER &middot; NLP ENGINE</text>

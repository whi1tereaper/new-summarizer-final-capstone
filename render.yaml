services:
  - type: web
    name: ai-article-summarizer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health.php
    envVars:
      - key: APP_NAME
        value: AI Article Summarizer
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: SESSION_NAME
        value: LIGHT_SESSID
      - key: LOCAL_PYTHON_BIN
        value: /opt/venv/bin/python
      - key: LOCAL_PYTHON_SCRIPT
        value: python-engine/local_cli.py
      - key: LOCAL_PYTHON_TIMEOUT
        value: "180"
      - key: NLTK_DATA
        value: /usr/local/share/nltk_data
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: POPPLER_PATH
        value: /usr/bin
      - key: SUMMARIZER_ENGINE_VERSION
        value: legacy
      - key: SUMMARIZER_LOCAL_EMBEDDING_MODEL
        value: ""
      - key: STORAGE_ROOT
        value: storage
      - key: STORAGE_UPLOADS
        value: storage/uploads
      - key: STORAGE_AUDIO
        value: storage/audio
      - key: STORAGE_LOGS
        value: storage/logs
      - key: STORAGE_TMP
        value: storage/tmp
      - key: TRANSLATION_PROVIDER
        value: deep-translator
      - key: TRANSLATION_TARGET_LANG
        value: tl
      - key: TTS_MAX_CHARS
        value: "0"
      - key: TTS_MAX_TEXT_LENGTH
        value: "0"
      - key: TTS_REQUEST_TIMEOUT_SECONDS
        value: "600"
      - key: TTS_OUTPUT_DIR
        value: storage/audio
      - key: AUDIO_OUTPUT_DIR
        value: storage/audio
      - key: AUDIO_PUBLIC_URL
        value: tts_audio.php
      - key: PIPER_BIN
        value: ""
      - key: PIPER_VOICE
        value: en_US-lessac-medium
      - key: PIPER_MODEL_EN
        value: ""
      - key: PIPER_MODEL_FIL
        value: ""
      - key: PIPER_CONFIG_EN
        value: ""
      - key: PIPER_CONFIG_FIL
        value: ""
      - key: PIPER_CACHE_DIR
        value: storage/audio
      - key: PIPER_DATA_DIR
        value: python-engine/models/piper
      - key: PIPER_DOWNLOAD_TIMEOUT_SECONDS
        value: "0"
      - key: PIPER_USE_CUDA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_CHARSET
        value: utf8mb4
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

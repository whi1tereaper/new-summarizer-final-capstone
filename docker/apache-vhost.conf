<VirtualHost *:80>
    ServerName _
    DocumentRoot /var/www/html/app/public

    <Directory /var/www/html/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Keep application internals outside the web root even if aliases are added later.
    <DirectoryMatch "^/var/www/html/(app/src|app/config|storage|python-engine|vendor)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

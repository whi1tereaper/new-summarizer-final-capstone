<svg xmlns="http://www.w3.org/2000/svg" width="600" height="645" viewBox="0 0 600 645" role="img" aria-label="Use cases: Assigned evaluator" style="background: white;"><defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#222"></path></marker></defs><rect width="600" height="645" fill="white"></rect><text x="300.0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold">LIGHT summarizer: assigned evaluator</text><rect x="25" y="105" width="150" height="95" rx="0" fill="white" stroke="#222" stroke-width="2"></rect><text x="100.0" y="146.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal">Assigned</text><text x="100.0" y="171.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal">evaluator</text><rect x="205" y="80" width="370" height="395" fill="none" stroke="#555" stroke-width="1.5"></rect><text x="390" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold">LIGHT summarizer</text><path d="M175,152 L218,175" fill="none" stroke="#222" stroke-width="2"></path><ellipse cx="390.5" cy="175.0" rx="172.5" ry="45.0" fill="#fff" stroke="#222" stroke-width="2"></ellipse><text x="390.5" y="169.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Open an eligible review</text><text x="390.5" y="193.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">with its assignment token</text><path d="M175,152 L218,295" fill="none" stroke="#222" stroke-width="2"></path><ellipse cx="390.5" cy="295.0" rx="172.5" ry="45.0" fill="#fff" stroke="#222" stroke-width="2"></ellipse><text x="390.5" y="289.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Inspect source material</text><text x="390.5" y="313.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">and the assigned output</text><path d="M175,152 L218,415" fill="none" stroke="#222" stroke-width="2"></path><ellipse cx="390.5" cy="415.0" rx="172.5" ry="45.0" fill="#fff" stroke="#222" stroke-width="2"></ellipse><text x="390.5" y="409.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Submit the permitted</text><text x="390.5" y="433.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">assessment and ratings</text><text x="300" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal">Evaluator is an assignment to an existing account, not a third</text><text x="300" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal">stored role. It does not grant administration.</text></svg>
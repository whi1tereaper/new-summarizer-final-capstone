<svg xmlns="http://www.w3.org/2000/svg" width="600" height="885" viewBox="0 0 600 885" role="img" aria-label="Use cases: Guest visitor" style="background: white;"><defs><marker id="arrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7 Z" fill="#222"></path></marker></defs><rect width="600" height="885" fill="white"></rect><text x="300.0" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold">LIGHT summarizer: guest visitor</text><rect x="25" y="105" width="150" height="95" rx="0" fill="white" stroke="#222" stroke-width="2"></rect><text x="100.0" y="146.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal">Guest</text><text x="100.0" y="171.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal">visitor</text><rect x="205" y="80" width="370" height="635" fill="none" stroke="#555" stroke-width="1.5"></rect><text x="390" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold">LIGHT summarizer</text><path d="M175,152 L218,175" fill="none" stroke="#222" stroke-width="2"></path><ellipse cx="390.5" cy="175.0" rx="172.5" ry="45.0" fill="#fff" stroke="#222" stroke-width="2"></ellipse><text x="390.5" y="169.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Provide text, URL, PDF or DOCX</text><text x="390.5" y="193.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">and choose summary settings</text><path d="M175,152 L218,295" fill="none" stroke="#222" stroke-width="2"></path><ellipse cx="390.5" cy="295.0" rx="172.5" ry="45.0" fill="#fff" stroke="#222" stroke-width="2"></ellipse><text x="390.5" y="289.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Generate a summary; inspect</text><text x="390.5" y="313.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">progress, retry or cancel</text><path d="M175,152 L218,415" fill="none" stroke="#222" stroke-width="2"></path><ellipse cx="390.5" cy="415.0" rx="172.5" ry="45.0" fill="#fff" stroke="#222" stroke-width="2"></ellipse><text x="390.5" y="409.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Read an authorized result;</text><text x="390.5" y="433.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">copy / export / reading helpers</text><path d="M175,152 L218,535" fill="none" stroke="#222" stroke-width="2"></path><ellipse cx="390.5" cy="535.0" rx="172.5" ry="45.0" fill="#fff" stroke="#222" stroke-width="2"></ellipse><text x="390.5" y="529.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Submit permitted rating</text><text x="390.5" y="553.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">and feedback comments</text><path d="M175,152 L218,655" fill="none" stroke="#222" stroke-width="2"></path><ellipse cx="390.5" cy="655.0" rx="172.5" ry="45.0" fill="#fff" stroke="#222" stroke-width="2"></ellipse><text x="390.5" y="649.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">Register, sign in or</text><text x="390.5" y="673.27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal">request password recovery</text><text x="300" y="815" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal">Guest context has no personal history or standalone Nutshell.</text><text x="300" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="normal">Reading helpers remain subject to route guards.</text></svg>